<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XyloConnect Status</title>
<meta name="description" content="Live status and uptime history for XyloConnect services.">
<link rel="icon" href="data:image/x-icon;base64,AAABAAIAICAAAAEAIAD/AAAAJgAAADAwAAABACAARgEAACUBAACJUE5HDQoaCgAAAA1JSERSAAAAIAAAACAIBgAAAHN6evQAAADGSURBVHicY+Tm5v7PMICAaSAtH3XAaAiMhgAIsODLIrzaZljFP189RXsHSIXlMkiF5mCVu9kQSzVHsJCjiVfbHOwAUAiB2Mjg2arJtHcADKg3LGZAB5+vniQpdFgYaARAUcirBUlDz1ZPxukoFpo5ACn98F6DRBk2wMQwwIBp1AEMIz0KWGhl8LPVU+DZEFQ20N8Bq4grEVkosmT1FIpKQbwOAAcbjsqI3HIfG2DE1yynR3XMONovYBhgwDTqAIbRKGAYWAAADuA6qqij5LwAAAAASUVORK5CYIKJUE5HDQoaCgAAAA1JSERSAAAAMAAAADAIBgAAAFcC+YcAAAENSURBVHic7de9DcIwEIbhl0/poizAAiloEUwCHRvADuwAG9CRSUC0FCyQBRgAlIIm4seEBPxJPK0vjk8+x7lemqYXjAlzwpwwJ8wJc8KcMCfMCXPCnDAnzCWhgf3pgv5k/jSmLNaU2xXf1Av9Gx0Wp6AJD5Oc6HYgG4yCJ6xiz8f90+du418toSby5ebh2Gk5ayWRzg7xq13LBuNW3tPpDryTbFZLKPRjEEUC+Z1SOx93QSVmfw8Ic8KcMCfMCXPCnDAnzCVEoCzWjW7heBLYNm+C/iX0SFUCVXfWdVOT0LL6wtrsvhqXULWI+kG7JyTmZ019rIQ5YU6YE+aEOWFOmBPmhDlhTpjTrxfwqSsKEz9f0VFWpgAAAABJRU5ErkJggg==">
<style>
  :root {
    --paper: #FAFCFD;
    --ink: #17232C;
    --muted: #5A6B78;
    --faint: #8FA0AC;
    --line: #DCE5EA;
    --panel: #FFFFFF;
    --panel-2: #F1F6F9;
    --primary: #1381B6;
    --cyan: #41B6E6;
    --primary-ink: #0E6491;
    --good: #2E9E5B;
    --good-bg: #E7F5EC;
    --warn: #B87514;
    --warn-bg: #FBF1DE;
    --bad: #C4453B;
    --bad-bg: #FAE9E7;
    --shadow: 0 1px 2px rgba(23,35,44,.05), 0 8px 24px rgba(23,35,44,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #10181E;
      --ink: #E4EDF2;
      --muted: #97A8B4;
      --faint: #6E8290;
      --line: #24333D;
      --panel: #16212A;
      --panel-2: #1B2933;
      --primary: #2E9FD4;
      --cyan: #41B6E6;
      --primary-ink: #6BC5EC;
      --good: #48B476;
      --good-bg: #15301F;
      --warn: #D99A3D;
      --warn-bg: #33270F;
      --bad: #E06A60;
      --bad-bg: #371B18;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.6 "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 0 20px 80px;
  }
  main { max-width: 780px; margin: 0 auto; }
  a { color: var(--primary-ink); }
  .num { font-variant-numeric: tabular-nums; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 40px 0 24px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
  .brand .mark { width: 32px; height: 25px; display: block; }
  .brand small { font-weight: 500; color: var(--muted); font-size: 14px; }
  .updated { font-size: 12.5px; color: var(--faint); text-align: right; }

  .banner-wrap { border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  .banner { display: flex; align-items: center; gap: 12px; padding: 16px 20px; font-weight: 600; font-size: 16px; }
  .banner.good { background: var(--good-bg); color: var(--good); }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }
  .banner.bad  { background: var(--bad-bg);  color: var(--bad); }
  .banner .beacon { width: 11px; height: 11px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 20%, transparent); flex: 0 0 auto; }
  .banner .uptime { margin-left: auto; font-weight: 500; font-size: 12.5px; opacity: .85; white-space: nowrap; }

  .active-updates { background: var(--panel); border-top: 1px solid var(--line); }
  .active-updates .update { padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .active-updates .update:last-child { border-bottom: none; }
  .update .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .update .head b { font-size: 14.5px; }
  .update .when { font-size: 12px; color: var(--faint); margin-left: auto; white-space: nowrap; }
  .update p { margin: 6px 0 0; font-size: 13.5px; color: var(--muted); }
  .update .comps { margin-top: 6px; font-size: 12px; color: var(--faint); }

  .sev { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; border-radius: 999px; padding: 1px 8px; text-transform: uppercase; }
  .sev.outage { color: var(--bad); background: var(--bad-bg); }
  .sev.degraded { color: var(--warn); background: var(--warn-bg); }
  .sev.maintenance { color: var(--primary-ink); background: var(--panel-2); }

  .comp-list { margin-top: 26px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 18px; box-shadow: var(--shadow); }
  .comp { display: grid; grid-template-columns: minmax(140px, 200px) 1fr auto auto; gap: 8px 16px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .comp:last-child { border-bottom: none; }
  .comp .name { font-size: 14px; font-weight: 600; }
  .comp .name span { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .comp .name .live { display: block; font-weight: 400; font-size: 11.5px; color: var(--faint); }
  .barwrap { overflow: hidden; }
  .bars { display: flex; gap: 2px; height: 26px; align-items: flex-end; min-width: 180px; }
  .bars i { flex: 1; min-width: 2px; height: 100%; border-radius: 1.5px; background: var(--good); opacity: .82; }
  .bars i.w { background: var(--warn); }
  .bars i.d { background: var(--bad); }
  .bars i.e { background: var(--line); }
  .comp .pct { font-size: 13px; color: var(--muted); text-align: right; }
  .pill { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; justify-self: end; }
  .pill.good { color: var(--good); background: var(--good-bg); }
  .pill.warn { color: var(--warn); background: var(--warn-bg); }
  .pill.bad  { color: var(--bad);  background: var(--bad-bg); }
  .pill.unknown { color: var(--muted); background: var(--panel-2); }
  @media (max-width: 620px) {
    .comp { grid-template-columns: 1fr auto; }
    .comp .barwrap { grid-column: 1 / -1; }
    .comp .pct { display: none; }
  }

  .incidents { margin-top: 34px; }
  .incidents h2 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .inc { border: 1px solid var(--line); border-radius: 10px; padding: 13px 16px; background: var(--panel); margin-bottom: 10px; }
  .inc .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .inc b { font-size: 14px; }
  .inc .when { font-size: 12px; color: var(--faint); margin-left: auto; white-space: nowrap; }
  .inc p { font-size: 13px; color: var(--muted); margin: 5px 0 0; }
  .none { color: var(--faint); font-size: 13.5px; }

  footer { margin-top: 46px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--faint); display: flex; gap: 16px; flex-wrap: wrap; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <svg class="mark" viewBox="0 0 2143 1654" aria-hidden="true">
        <g fill="#3FB6E4">
          <rect width="780" height="1654" rx="127"/>
          <rect x="970" y="204" width="591" height="1245" rx="96"/>
          <rect x="1752" y="412" width="391" height="830" rx="64"/>
        </g>
      </svg>
      XyloConnect&nbsp;<small>Status</small>
    </div>
    <div class="updated" id="updated">Loading…</div>
  </header>

  <div class="banner-wrap">
    <div class="banner good" id="banner">
      <span class="beacon"></span><span id="banner-label">Checking…</span>
      <span class="uptime num" id="banner-uptime"></span>
    </div>
    <div class="active-updates" id="active-updates" hidden></div>
  </div>

  <div class="comp-list" id="components"></div>

  <section class="incidents">
    <h2>Past incidents</h2>
    <div id="incidents"><p class="none">Loading…</p></div>
  </section>

  <footer>
    <span>Automated checks run every few minutes; core services are also re-checked live when this page loads.</span>
    <a href="https://xyloconnect.com">xyloconnect.com</a>
  </footer>
</main>

<script>
const HISTORY_URL = 'https://raw.githubusercontent.com/xyloconnect/status/data/history.json'
const UPDATES_URL = 'https://bugs.xyloconnect.com/api/v1/status-updates'
const MONITOR_BASE = 'https://uu8janobz6.execute-api.us-east-1.amazonaws.com/QA/monitoring/load'

const COMPONENTS = [
  { id: 'app', name: 'Web app', desc: 'xyloconnect.com' },
  { id: 'api', name: 'API', desc: 'core requests + auth' },
  { id: 'db', name: 'Database', desc: 'primary data store' },
  { id: 'tables', name: 'Tables', desc: 'grid views + records' },
  { id: 'docs', name: 'Documents', desc: 'docs workspace' },
  { id: 'support', name: 'Support', desc: 'help desk + ticketing' },
  { id: 'media', name: 'Media & assets', desc: 'images, files, map layers' },
]
const LIVE_CHECKS = [
  { url: MONITOR_BASE + '?interface=lambda', comps: ['api'] },
  { url: MONITOR_BASE + '?interface=rds', comps: ['db'] },
  { url: MONITOR_BASE + '?interface=ec2', comps: ['tables'] },
]
const DAYS = 90
const STATE_RANK = { operational: 0, unknown: 0, degraded: 1, down: 2 }
const SEV_RANK = { maintenance: 0, degraded: 1, outage: 2 }

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

function agoLabel(iso) {
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000)
  if (mins < 1) return 'just now'
  if (mins < 60) return `${mins} minute${mins === 1 ? '' : 's'} ago`
  const hrs = Math.round(mins / 60)
  if (hrs < 48) return `${hrs} hour${hrs === 1 ? '' : 's'} ago`
  return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
}
function rangeLabel(startIso, endIso) {
  const opts = { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }
  const start = new Date(startIso).toLocaleString(undefined, opts)
  if (!endIso) return `Started ${start}`
  const end = new Date(endIso).toLocaleString(undefined, { hour: 'numeric', minute: '2-digit' })
  return `${start} – ${end}`
}
function dayKeysUTC(n) {
  const keys = []
  const d = new Date()
  for (let i = n - 1; i >= 0; i--) {
    const t = new Date(Date.now() - i * 86400000)
    keys.push(t.toISOString().slice(0, 10))
  }
  return keys
}

function dayState(day) {
  if (!day) return 'e'
  const total = day.o + day.d + day.x
  if (!total) return 'e'
  if (day.x >= 3 || day.x / total > 0.05) return 'd'   // red bar
  if (day.d + day.x >= 3) return 'w'                    // amber bar
  return 'o'
}

function renderComponents(history) {
  const wrap = $('components')
  wrap.innerHTML = ''
  const keys = dayKeysUTC(DAYS)
  let overall = 'operational'
  let upSum = 0, upCount = 0

  for (const comp of COMPONENTS) {
    const entry = history?.components?.[comp.id]
    const state = entry?.state ?? 'unknown'
    if (STATE_RANK[state] > STATE_RANK[overall]) overall = state

    let up = 0, total = 0
    const bars = keys.map((k) => {
      const day = entry?.daily?.[k]
      if (day) {
        const runs = day.o + day.d + day.x
        up += day.o + day.d
        total += runs
      }
      const cls = dayState(day)
      return `<i${cls === 'o' ? '' : ` class="${cls}"`}></i>`
    }).join('')
    const pct = total ? (100 * up / total) : null
    if (pct !== null) { upSum += pct; upCount++ }

    const pillCls = state === 'operational' ? 'good' : state === 'degraded' ? 'warn' : state === 'down' ? 'bad' : 'unknown'
    const pillLabel = state === 'operational' ? 'Operational' : state === 'degraded' ? 'Degraded' : state === 'down' ? 'Down' : 'No data'
    wrap.insertAdjacentHTML('beforeend', `
      <div class="comp" data-comp="${comp.id}">
        <div class="name">${esc(comp.name)}<span>${esc(comp.desc)}</span><span class="live" data-live></span></div>
        <div class="barwrap"><div class="bars" title="Last ${DAYS} days">${bars}</div></div>
        <div class="pct num">${pct === null ? '—' : pct >= 99.995 ? '100%' : pct.toFixed(2) + '%'}</div>
        <span class="pill ${pillCls}">${pillLabel}</span>
      </div>`)
  }
  return { overall, uptime: upCount ? upSum / upCount : null }
}

function renderBanner(overall, uptime, activeUpdates) {
  let sevState = 'operational'
  for (const u of activeUpdates) {
    if (u.severity === 'outage') sevState = 'down'
    else if (u.severity === 'degraded' && sevState !== 'down') sevState = 'degraded'
  }
  const state = STATE_RANK[sevState] > STATE_RANK[overall] ? sevState : overall
  const banner = $('banner')
  banner.className = 'banner ' + (state === 'down' ? 'bad' : state === 'degraded' ? 'warn' : 'good')
  $('banner-label').textContent =
    state === 'down' ? 'Some systems down'
    : state === 'degraded' ? 'Some systems degraded'
    : activeUpdates.length ? 'All systems operational · maintenance in progress'
    : 'All systems operational'
  $('banner-uptime').textContent = uptime === null ? '' : `${DAYS}-day uptime ${uptime >= 99.995 ? '100' : uptime.toFixed(2)}%`

  const wrap = $('active-updates')
  if (!activeUpdates.length) { wrap.hidden = true; wrap.innerHTML = ''; return }
  wrap.hidden = false
  wrap.innerHTML = activeUpdates.map((u) => `
    <div class="update">
      <div class="head"><span class="sev ${esc(u.severity)}">${esc(u.severity)}</span><b>${esc(u.title)}</b>
        <span class="when">${esc(rangeLabel(u.createdAt, null))}</span></div>
      ${u.body ? `<p>${esc(u.body)}</p>` : ''}
      ${u.components?.length ? `<div class="comps">Affects: ${esc(u.components.map((c) => COMPONENTS.find((x) => x.id === c)?.name ?? c).join(', '))}</div>` : ''}
    </div>`).join('')
}

function renderIncidents(resolved) {
  const wrap = $('incidents')
  if (!resolved.length) { wrap.innerHTML = '<p class="none">No incidents in the last 90 days.</p>'; return }
  wrap.innerHTML = resolved.map((u) => `
    <div class="inc">
      <div class="head"><span class="sev ${esc(u.severity)}">${esc(u.severity)}</span><b>Resolved · ${esc(u.title)}</b>
        <span class="when">${esc(rangeLabel(u.createdAt, u.resolvedAt))}</span></div>
      ${u.body ? `<p>${esc(u.body)}</p>` : ''}
    </div>`).join('')
}

async function fetchJson(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`http ${res.status}`)
  return res.json()
}

async function liveChecks() {
  let anyOk = false
  await Promise.all(LIVE_CHECKS.map(async (check) => {
    let label
    try {
      const started = Date.now()
      const res = await fetch(check.url, { signal: AbortSignal.timeout(15000) })
      const body = res.ok ? await res.json().catch(() => null) : null
      const secs = ((Date.now() - started) / 1000).toFixed(1)
      const ok = res.ok && body?.timeout !== true && body?.ok !== false
      if (ok) anyOk = true
      label = ok ? `live check just now · ${secs}s` : 'live check failed just now'
    } catch {
      label = 'live check failed just now'
    }
    for (const id of check.comps) {
      const el = document.querySelector(`[data-comp="${id}"] [data-live]`)
      if (el) el.textContent = label
    }
  }))
  return anyOk
}

async function load() {
  let history = null, updates = []
  try { history = await fetchJson(HISTORY_URL) } catch { /* first runs may not exist yet */ }
  try {
    const data = await fetchJson(UPDATES_URL)
    updates = Array.isArray(data?.updates) ? data.updates : []
  } catch { /* status updates are additive; the page works without them */ }

  updates.sort((a, b) => (SEV_RANK[b.severity] ?? 0) - (SEV_RANK[a.severity] ?? 0) || new Date(b.createdAt) - new Date(a.createdAt))
  const active = updates.filter((u) => u.status === 'active')
  const resolved = updates.filter((u) => u.status === 'resolved')
    .sort((a, b) => new Date(b.resolvedAt ?? b.createdAt) - new Date(a.resolvedAt ?? a.createdAt))

  const { overall, uptime } = renderComponents(history)
  renderBanner(overall, uptime, active)
  renderIncidents(resolved)
  const historyLabel = history?.updatedAt
    ? `History updated ${agoLabel(history.updatedAt)}`
    : 'Collecting first checks…'
  $('updated').textContent = historyLabel

  liveChecks().then((anyOk) => {
    if (anyOk) $('updated').textContent = `Checked just now · ${historyLabel.charAt(0).toLowerCase()}${historyLabel.slice(1)}`
  })
}
load()
setInterval(load, 5 * 60000)
</script>
</body>
</html>
